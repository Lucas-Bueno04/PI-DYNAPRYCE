# Mesma origem (ADR-001): a SPA em / e a API em /api. TLS, cabeçalhos de segurança e limite de taxa.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
limit_req_status 429;
server_tokens off;

server {
  listen 8443 ssl;
  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  include /etc/nginx/conf.d/seguranca.inc;
  root /usr/share/nginx/html;

  location /api/v1/auth/ {
    limit_req zone=auth burst=15 nodelay;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_pass http://api:8000;
  }

  location /api/v1/importacoes {
    client_max_body_size 11m;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_pass http://api:8000;
  }

  location /api/ {
    client_max_body_size 1m;
    include /etc/nginx/conf.d/proxy.inc;
    proxy_pass http://api:8000;
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/conf.d/seguranca.inc;
  }
}
